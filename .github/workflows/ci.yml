name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit SHA (version in the comment). Runner image pinned too: ubuntu-latest may move.
jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: php -l on every PHP file (parse errors and compile-time deprecations fail)
        run: |
          out=$(git ls-files -z -- '*.php' | xargs -0 -n 1 php -d display_errors=stderr -d error_reporting=-1 -l 2>&1 | grep -v '^No syntax errors detected' || true)
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi

  phpcs:
    name: PHPCS (WPCS 3, PHPCompatibilityWP)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:2.10.3
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - name: PHPCS
        run: vendor/bin/phpcs
      - name: JSON files are valid (blueprint, Claude Code plugin, Composer, injection cases)
        run: git ls-files -z -- '*.json' | xargs -0 -n 1 jq empty

  phpunit:
    name: PHPUnit PHP ${{ matrix.php }}, WordPress ${{ matrix.wp }}${{ matrix.multisite == '1' && ', multisite' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # WordPress 6.2 = "Requires at least" in coquille-revue.php.
          - { php: "7.4", wp: "6.2", multisite: "0" }
          - { php: "8.3", wp: "7.1", multisite: "0" }
          - { php: "8.3", wp: "7.1", multisite: "1" }
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress
      WP_MULTISITE: ${{ matrix.multisite }}
      WP_INSTALL_TESTS_SKIP_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: composer:2.10.3
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - name: Install WordPress and its test suite
        run: bash bin/install-wp-tests.sh wordpress_tests root root 127.0.0.1:3306 ${{ matrix.wp }} true
      - name: PHPUnit
        run: vendor/bin/phpunit

  plugin-check:
    name: Plugin Check (contents of the zip)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the zip and unpack it
        run: |
          bash bin/build-zip.sh
          mkdir -p dist
          unzip -q build/coquille-revue-*.zip -d dist
      - uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: dist/coquille-revue
          # The job keeps a read-only token: no comment on pull requests. Only errors fail the job.
          repo-token: ""

  release:
    name: Draft release with the zips
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, phpcs, phpunit, plugin-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag, plugin header and constant must match
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header=$(sed -n 's/^ \* Version:[[:space:]]*//p' coquille-revue.php | tr -d '\r' | sed 's/[[:space:]]*$//')
          constant=$(sed -n "s/^const COQUILLE_REVUE_VERSION *= *'\([^']*\)'.*/\1/p" coquille-revue.php)
          if [ "$tag" != "$header" ] || [ "$tag" != "$constant" ]; then
            echo "::error::Tag v$tag, header Version $header, COQUILLE_REVUE_VERSION $constant: all three must match."
            exit 1
          fi
      - name: Build the zips and the release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          bash bin/build-zip.sh
          # Fixed name, for the link releases/latest/download/coquille-revue.zip (Playground blueprint).
          cp "build/coquille-revue-$v.zip" build/coquille-revue.zip
          awk -v head="## [$v]" 'index($0, "## [") == 1 { keep = (index($0, head) == 1); next } keep' CHANGELOG.md > build/release-notes.md
          if [ ! -s build/release-notes.md ]; then
            echo "::error::No '## [$v]' section in CHANGELOG.md."
            exit 1
          fi
      - name: Create the release as a draft (published by hand)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists: nothing changed. Attach coquille-revue-$v.zip and coquille-revue.zip by hand."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "build/coquille-revue-$v.zip" build/coquille-revue.zip \
            --draft --verify-tag --title "Coquille Revue $v" --notes-file build/release-notes.md
